# This file was created automatically with `jupyter-book init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    # Only the default branch; PRs are covered by the `pull_request` trigger
    # below, so an unfiltered `push` would build every branch twice.
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: ''  # /${{ github.event.repository.name }}

# Default permissions are read-only; the deploy job elevates its own.
permissions:
  contents: read

# Supersede redundant builds for the same ref. On main we let every run finish,
# since each one may publish; elsewhere only the latest commit is worth building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Runs on every push and pull request, so build breakage surfaces before merge.
    permissions:
      contents: read
      # Needed only to post the preview link back to the PR.
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          pip install -r requirements.txt --break-system-packages
      - name: Install Jupyter Book (via myst)
        run: |
          npm install -g jupyter-book
          npm install -g mystmd
      - name: Setup Typst
        uses: typst-community/setup-typst@v4
      - name: Build PDF Assets
        run: myst build --pdf
      - name: Build HTML Assets
        run: jupyter-book build --execute --html
      # Concatenates the step0-4 pages, wrapped in SKILL-HEADER.md and
      # SKILL-FOOTER.md, into _build/html/SKILL.md, so the user guide is
      # published as a single Agent-Skills file at <site>/SKILL.md. Runs after
      # the HTML build only so that the output directory exists.
      - name: Build SKILL.md
        run: python scripts/build_skill.py
      # Bakes banner.yml into every built page. No-op when the banner is
      # disabled. Must run after the HTML build and before the upload; the PDF
      # is built earlier on purpose, so it never carries the banner.
      - name: Inject site banner
        if: github.event_name != 'pull_request'
        run: python scripts/inject_banner.py
      # PR builds are published as Cloudflare Pages previews (fork PRs only on
      # request, via preview.yml), so they always carry a banner saying so,
      # stamped with the build time (merged with banner.yml if that is enabled).
      - name: Inject preview banner
        if: github.event_name == 'pull_request'
        run: python scripts/inject_banner.py --preview "$(date -u '+%Y-%m-%d %H:%M UTC')"
      # Inlines assets/checklist.js, which adds a tick-able section checklist
      # (client-side, from the rendered headings) to the pages listed under
      # site.options.checklist_pages in myst.yml.
      - name: Inject section checklist
        run: python scripts/inject_checklist.py
      # Preview deploys go to Cloudflare Pages, not GitHub Pages, which only has
      # room for one deployment (production, from main). Skipped for forked PRs:
      # their runs cannot read secrets, and handing a Pages-write token to
      # unreviewed code would be a bad trade for a preview. Fork PRs instead keep
      # their build as an artifact, which a maintainer can deploy with preview.yml.
      - name: Deploy PR preview to Cloudflare Pages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/cf-preview
        with:
          directory: ./_build/html
          pr: ${{ github.event.pull_request.number }}
          commit: ${{ github.sha }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
      # preview.yml finds this artifact by name and by the PR head commit of
      # this run, so the name must stay in step with it.
      - name: Keep fork PR build for preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: preview-html
          path: ./_build/html
          retention-days: 14
      - name: Explain how to preview a fork PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "Fork PR: no preview was deployed. After reviewing the changes, a maintainer can deploy this build with:" >> "$GITHUB_STEP_SUMMARY"
          echo '`gh workflow run preview.yml -f pr='"$PR"'`' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

  deploy:
    # Only publish from main: a push to main, or a manual dispatch run on main.
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
