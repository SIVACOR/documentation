version: 1
project:
  title: SIVACOR
  authors:
    - name: SIVACOR Team
  copyright: '2025'
  exclude:
    - venv/*
  github: sivacor/documentation
  #bibliography:
  #  - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: docs/intro.md
    - file: docs/steps.md
    - file: docs/faq.md
    - file: docs/about.md
    - url: 'https://submit.sivacor.org'
      title: Submit a job
    
    
site:
  options:
    logo: site_logo.png
    favicon: favicon.ico
    folders: true
  template: book-theme
  actions:
    - title: Submit a Job
      url: https://submit.sivacor.org
  parts:
    footer: footer.md
