version: 1
project:
  title: SIVACOR
  authors:
    - name: SIVACOR Team
  copyright: '2025'
  exclude:
    - venv/*
  github: sivacor/documentation
  #bibliography:
  #  - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
      id: pdf_book
  toc:
    - file: docs/intro.md
    - file: docs/steps.md
      children:
        - file: docs/step0-prepare.md
        - file: docs/step1-upload.md
        - file: docs/step2-choosing-image.md
        - file: docs/step3-monitoring.md
        - file: docs/step4-download.md
    - file: docs/faq.md
    - file: docs/about.md
    - url: 'https://submit.sivacor.org'
      title: Submit a job
    
project:
  downloads:
    - file: pdf_book
      title: PDF   
site:
  options:
    logo: site_logo.png
    favicon: favicon.ico
    folders: true
    hide_myst_branding: true
    source_download: false
    license: CC-BY-4.0
  template: book-theme
  actions:
    - title: Submit a Job
      url: https://submit.sivacor.org
  parts:
    footer: footer.md
